# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
   configuration: python/packages/brilliant_msg/docs/source/conf.py

# Install the package with docs extras using pip
python:
   install:
   - method: pip
     path: python/packages/brilliant_msg
     extra_requirements:
       - docs
