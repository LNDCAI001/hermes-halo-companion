[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "halo-companion"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "brilliant-msg>=7.0.0",
    "halo-emulator>=1.0.0",
]

[project.optional-dependencies]
tests = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/halo_companion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
