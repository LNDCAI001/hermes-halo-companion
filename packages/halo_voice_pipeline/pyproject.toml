[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "halo-voice-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.0.0",
    "faster-whisper>=1.0.0",
    "pydub>=0.25.0",
    "numpy>=1.24",
    "pillow>=11.0",
]

[project.optional-dependencies]
capture = [
    "fastapi>=0.109.0",
    "python-multipart>=0.0.7",
    "uvicorn>=0.27.0",
    "brilliant-msg>=7.0.0",
    "brilliant-ble>=3.0.0",
    "lc3py>=1.1.3",
    "opencv-python>=4.0.0",
]
tests = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/halo_voice_pipeline"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
