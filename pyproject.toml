[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.workspace]
members = [
    "packages/brilliant_ble",
    "packages/brilliant_msg",
    "packages/brilliant_sdk",
    "packages/halo_emulator",
    "packages/halo_voice_pipeline",
    "packages/halo_companion",
]

[tool.uv.sources]
brilliant-ble = { workspace = true }
brilliant-msg = { workspace = true }
halo-emulator = { workspace = true }
